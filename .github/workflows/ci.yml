name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run check
      - name: Verify public MCP discovery
        # The action always authenticates (Bearer API key). Without credentials the
        # server must answer 401 and point clients to its OAuth metadata.
        run: |
          node <<'NODE'
          const response = await fetch('https://getminds.ai/mcp', {
            method: 'POST',
            headers: {
              Accept: 'application/json, text/event-stream',
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              jsonrpc: '2.0',
              id: 1,
              method: 'initialize',
              params: {
                protocolVersion: '2025-06-18',
                capabilities: {},
                clientInfo: { name: 'minds-action-ci', version: '1.0.0' },
              },
            }),
          });
          if (response.status !== 401) throw new Error(`Unauthenticated initialize should answer 401, got ${response.status}`);
          const challenge = response.headers.get('www-authenticate') ?? '';
          const metadataUrl = challenge.match(/resource_metadata="([^"]+)"/)?.[1];
          if (!metadataUrl) throw new Error(`401 without OAuth resource metadata: ${challenge}`);
          const metadata = await fetch(metadataUrl);
          if (!metadata.ok) throw new Error(`OAuth resource metadata failed: ${metadata.status}`);
          const { authorization_servers: servers } = await metadata.json();
          if (!servers?.length) throw new Error('OAuth resource metadata lists no authorization server');
          console.log(`MCP discovery OK: ${metadataUrl} -> ${servers.join(', ')}`);
          NODE
