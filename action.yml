name: "Minds Research Review"
description: "Plan or run reviewable synthetic market research from a GitHub workflow."
author: "Minds"

branding:
  icon: "users"
  color: "yellow"

inputs:
  api-key:
    description: "Minds API key stored as a GitHub Actions secret."
    required: true
  operation:
    description: "One of list-audiences, plan-study, ask-audience, get-study-status, or get-study-summary. Deprecated aliases list-groups, ask-group, get-panel-status and get-panel-summary still work."
    required: false
    default: "plan-study"
  endpoint:
    description: "Minds MCP endpoint."
    required: false
    default: "https://getminds.ai/mcp"
  audience-id:
    description: "Exact Minds Audience UUID."
    required: false
  audience-name:
    description: "Minds Audience name for fuzzy matching."
    required: false
  study-id:
    description: "Exact Minds Study UUID."
    required: false
  study-name:
    description: "Minds Study name for fuzzy matching."
    required: false
  group-id:
    description: "Deprecated alias of audience-id."
    required: false
  group-name:
    description: "Deprecated alias of audience-name."
    required: false
  panel-id:
    description: "Deprecated alias of study-id."
    required: false
  panel-name:
    description: "Deprecated alias of study-name."
    required: false
  request:
    description: "Research objective and requested questions for plan-study."
    required: false
  question:
    description: "Exact respondent-visible question for ask-audience."
    required: false
  stimulus:
    description: "Exact respondent-visible text to evaluate during plan-study."
    required: false
  stimulus-file:
    description: "Workspace-relative UTF-8 file containing respondent-visible text."
    required: false
  stimulus-label:
    description: "Human-readable label for the stimulus."
    required: false
  study-locale:
    description: "Study language: en, es, fr, de, zh, tr, ar, ja, or ko."
    required: false
  search-query:
    description: "Optional fuzzy filter for list-audiences."
    required: false
  refresh-summary:
    description: "Generate or refresh a Study summary."
    required: false
    default: "false"
  summary-length:
    description: "Study summary length: short, standard, or detailed."
    required: false
    default: "standard"

outputs:
  result-json:
    description: "The complete JSON-safe MCP tool result."
  study-id:
    description: "Study UUID returned or resolved by the operation, when present."
  panel-id:
    description: "Deprecated alias of study-id (same value)."
  draft-plan-id:
    description: "Study draft UUID returned by plan-study, when present."
  revision:
    description: "Study draft revision returned by plan-study, when present."
  workspace-url:
    description: "Minds workspace or result URL, when present."

runs:
  using: "node24"
  main: "src/main.mjs"
